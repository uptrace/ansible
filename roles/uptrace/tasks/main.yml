---
# Uptrace refuses to start with an empty service.secret or with the FIXME
# placeholder, so stop the play before it changes a host.
- name: Check the Uptrace secret
  assert:
    that:
      - secret is defined
      - secret is string
      - secret | trim | length > 0
      - secret != 'FIXME'
    fail_msg: >-
      Set `secret` in group_vars to a random value, e.g. from `openssl rand -hex 32`.
      Uptrace refuses an empty secret and the FIXME placeholder.
    quiet: true
  tags: [always]

- name: Create uptrace user
  user: name=uptrace groups=sudo shell=/bin/bash

- name: Create Uptrace data directory
  file: path=/var/lib/uptrace/ state=directory owner=uptrace group=uptrace mode=0755

- name: Create Uptrace config directory
  file: path=/etc/uptrace/ state=directory owner=uptrace group=uptrace mode=0755

- name: Record DEB architecture
  shell: dpkg --print-architecture
  register: arch

- name: Download Uptrace
  get_url:
    url: https://github.com/uptrace/uptrace/releases/download/v{{uptrace_version}}/uptrace_linux_{{arch.stdout}}
    dest: /usr/local/bin/uptrace
    owner: uptrace
    group: uptrace
    mode: 0755
    force: true
  notify:
    - Restart Uptrace
    - Restart Uptrace Worker

- name: Check Uptrace binary
  command: /usr/local/bin/uptrace version

# The files in ch_tls usually belong to the ClickHouse setup, e.g.
# root:clickhouse 0640, which the uptrace user cannot read. Uptrace reads the
# TLS files when it loads the config and refuses to start without them, so
# install copies it can read and point the config at them. A changed original
# changes its copy and restarts Uptrace.
- name: Find the ClickHouse TLS files
  set_fact:
    ch_tls_files: >-
      {{ (ch_tls or {}) | dict2items | selectattr('key', 'match', '.+_file$')
         | selectattr('value') | list }}
    uptrace_ch_tls: '{{ ch_tls }}'
  tags: [config]

- name: Point the config at the copies of the ClickHouse TLS files
  set_fact:
    uptrace_ch_tls: >-
      {{ uptrace_ch_tls | combine({item.key: '/etc/uptrace/tls/clickhouse-'
         ~ (item.key | regex_replace('_file$', '')) ~ '.pem'}) }}
  loop: '{{ ch_tls_files }}'
  loop_control:
    label: '{{ item.key }}'
  tags: [config]

- name: Create the Uptrace TLS directory
  file: path=/etc/uptrace/tls state=directory owner=root group=uptrace mode=0750
  when: ch_tls_files | length > 0
  tags: [config]

- name: Copy the ClickHouse TLS files for the uptrace user
  copy:
    src: '{{ item.value }}'
    dest: '{{ uptrace_ch_tls[item.key] }}'
    remote_src: true
    owner: root
    group: uptrace
    mode: '0640'
  loop: '{{ ch_tls_files }}'
  loop_control:
    label: '{{ item.key }}'
  notify:
    - Restart Uptrace
    - Restart Uptrace Worker
  tags: [config]

- set_fact:
    ch_shards:
      "{{ groups.clickhouse_server | map('extract', hostvars, 'ch_shard') | unique | sort }}"
  tags: [config]

- name: Upload Uptrace config
  template:
    src: config.yml
    dest: /etc/uptrace/config.yml
    # The config holds secrets. The service reads it through the uptrace group.
    owner: root
    group: uptrace
    mode: '0640'
  notify:
    - Restart Uptrace
    - Restart Uptrace Worker
  tags: [config]

- import_tasks: systemd.yml
  tags: [systemd]

- import_tasks: logging.yml
  tags: [logging]

# The serve and worker processes also delete expired data on their own
# schedule. This job is a second pass. "retention check" was removed in v2.1.
#
# Earlier versions named the job retention_check, which other deployments on
# the same host use too. Remove that entry only when it runs this config.
- name: Check for the old retention cron entry
  shell: >-
    crontab -l 2>/dev/null | grep -A1 -x '#Ansible: retention_check'
    | grep -qF -- '-config=/etc/uptrace/config.yml'
  register: old_retention_cron
  changed_when: false
  failed_when: false

- name: Remove the old retention cron entry
  cron:
    name: retention_check
    state: absent
  when: old_retention_cron.rc == 0

- name: Configure cron to delete old data
  cron:
    name: uptrace_retention
    job:
      /usr/bin/flock /var/lock/uptrace_retention.lock /usr/local/bin/uptrace
      -config=/etc/uptrace/config.yml storage retention
    weekday: '6' # Saturday
    hour: '0'
    minute: '15'

# Load the config as the service loads it, so a file the uptrace user cannot
# read stops the play here, not the service in a restart loop.
- name: Validate the Uptrace config as the uptrace user
  command: /usr/local/bin/uptrace --config=/etc/uptrace/config.yml config validate
  become_user: uptrace
  changed_when: false
  tags: [config, migrate]

# The old release keeps serving while the expand steps run.
- name: Apply the expand steps
  command: '/usr/local/bin/uptrace -config=/etc/uptrace/config.yml migrate up --before-release-change'
  when: primary is defined
  tags: [migrate]

# Restart each process whose binary or config changed, on every host, before
# the backfill. A process of v2.0.x or of a v2.1.0 beta cannot hear the restart
# request of "migrate up --restart", and the backfill must not run while one
# serves.
- name: Restart Uptrace on the new release
  meta: flush_handlers
  tags: [migrate]

- import_tasks: migrate.yml
  when: primary is defined
  tags: [migrate]

- import_tasks: start.yml
  tags: [systemd, migrate]
