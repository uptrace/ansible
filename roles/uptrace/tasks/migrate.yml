---
# The binary of the new release is installed on every host before this task,
# and the primary host runs the migrations with it. The expand steps already
# ran, and the handlers restarted each process on the new binary (main.yml).
#
# With --restart, `migrate up` asks the serve and worker processes of each host
# to stop at each restart row. They exit with status 75, and systemd starts
# the installed binary again (Restart=always in both units).
#
# uptrace_migrate_batch_pause_ratio, when it is set, passes --batch-pause-ratio.
# Unset, each migration keeps its own ratio.
- name: Migrate the databases
  command: >-
    /usr/local/bin/uptrace -config=/etc/uptrace/config.yml migrate up --restart
    {%- if uptrace_migrate_batch_pause_ratio not in ['', none] %}
    --batch-pause-ratio {{ uptrace_migrate_batch_pause_ratio | string | quote }}
    {%- endif %}

- name: Seed database
  command: '/usr/local/bin/uptrace -config=/etc/uptrace/config.yml db seed'
