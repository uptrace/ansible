uptrace_version: '2.1.0-rc.1'
uptrace_license: ''
uptrace_dsn: ''

ingest_url: '{{ site_url }}'

listen_http_addr: ':80'
listen_grpc_addr: ':4317'

auth_disabled: false
auth_sign_up_disabled: false
auth_sign_in_disabled: false

certmagic_enabled: false
certmagic_staging_ca: false
telegram_bot_token: ''

seed_data: {}

# The batch pause ratio of `migrate up`: the pause after each batch of a
# backfill, as a share of the time the batch took. Empty passes no flag, so
# each migration keeps its own ratio.
uptrace_migrate_batch_pause_ratio: ''

redis_db: 0
ch_port: 9440
ch_tls: null
